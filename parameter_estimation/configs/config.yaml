defaults:
  - base/hydra@_here_
  - base/globals@_here_
  - encoder: gru
  - ode: dupont_1991b
  - solver: rk4

  # Keep values below in this file
  - _self_

# ==========================================================
# DATA
# ==========================================================

data:
  name: PhysiomeDataModule

  path: "data/dupont_1991b/0"

  batch_size: 32

  num_workers: 2

# ==========================================================
# MODEL
# ==========================================================

model:
  name: ParameterEstimator
  state_dim: 2
  parameter_dim: 14

# ==========================================================
# TRAINING
# ==========================================================
loss:
  name: ParameterEstimationLoss

training:
  epochs: 100

  parameter_loss_weight: 0.1

  trajectory_loss_weight: 1.0

  patience: 15

  gradient_clip: 1.0

# ==========================================================
# METRICS
# ==========================================================

metrics:
  parameter:
    enabled: true

    methods:
      - mae
      - rmse
      - relative_error
      - per_parameter_relative_error
      - per_parameter_accuracy
      - overall_parameter_accuracy
      - log_mae

    params:
      tolerance: 0.1
      eps: 1.0e-8

  trajectory:
    enabled: true

    methods:
      - mae
      - rmse
      - normalized_rmse

    params:
      eps: 1.0e-8

  jgd:
    enabled: true

    methods:
      - pointwise_error
      - trajectory_distribution_error
      - temporal_dynamics_error
      - jgd_score

    params:
      eps: 1.0e-8

# ==========================================================
# OUTPUT
# ==========================================================

output:
  checkpoint: "checkpoints/best_model.pt"

  results: "results/test_results.pt"

  history: "results/training_history.pt"

  figures: "figures"
