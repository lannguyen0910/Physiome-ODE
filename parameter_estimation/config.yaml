experiment:
  seed: 42

data:
  path: "data/dupont_1991b/0"
  batch_size: 32
  num_workers: 2

model:
  state_dim: 2
  parameter_dim: 13
  hidden_dim: 128
  num_layers: 2
  dropout: 0.1

loss:
